services:
  - type: web
    name: newspulse-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB
        value: news-pulse
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: "10000"
      - key: AUTO_RSS_POLLING
        value: "true"
      - key: RSS_POLL_INTERVAL_MINUTES
        value: "5"
      - key: RSS_JOB_STALE_MINUTES
        value: "60"
      - key: NARRATIVE_ANALYSIS_ENABLED
        value: "true"
      - key: NARRATIVE_SHADOW_MODE
        value: "false"
      - key: NARRATIVE_POLL_INTERVAL_MINUTES
        value: "15"
      - key: NARRATIVE_MAX_EVENT_CLUSTERS
        value: "500"
      - key: NARRATIVE_INACTIVE_DAYS
        value: "45"
      - key: NARRATIVE_LEASE_MINUTES
        value: "30"
      - key: PYTHON_BIN
        value: /app/scraper/.venv/bin/python
      - key: SCRAPER_ENTRYPOINT
        value: /app/scraper/pipeline.py
